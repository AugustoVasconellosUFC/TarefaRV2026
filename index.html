<html>
  <head>
    <title>Segunda experiência de realidade aumentada usando o AR.js e o A-frame, com marcador Hiro e imagem.</title>
    <script src = "https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src = "https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden">
    <a-scene vr-mode-ui = "enabled: false" embedded arjs = "debugUIenabled: false">
      <a-marker preset="hiro">
        <a-image src="Starry_Night.jpg" position = "0 0.5 0" rotation = "-90 0 0" width = "1.26262626263" height = "1"></a-image>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
